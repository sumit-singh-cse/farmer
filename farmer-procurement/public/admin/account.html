<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - Farmer Procurement Hub</title>
  <link rel="stylesheet" href="../common/style.css">
  <link rel="stylesheet" href="admin.css">
  <style>
    .account-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .account-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="admin-console">
  <div id="navbar"></div>

  <main>
    <header class="gov-masthead">
      <div>
        <h2>Account</h2>
        <div class="gov-sub">Signed in as <strong id="acct-id">—</strong> (<span id="acct-role">—</span>)</div>
      </div>
    </header>

    <div class="account-grid">
      <!-- Change Password -->
      <div class="gov-panel">
        <div class="gov-panel-head"><h3>Change password</h3></div>
        <div class="gov-panel-body">
          <form id="change-password-form">
            <div class="gov-field">
              <label for="current-password">Current password</label>
              <input type="password" id="current-password" required>
            </div>
            <div class="gov-field">
              <label for="new-password">New password</label>
              <input type="password" id="new-password" minlength="6" required>
              <span style="font-size: 0.78rem; color: var(--muted);">At least 6 characters.</span>
            </div>
            <div class="gov-field">
              <label for="confirm-password">Confirm new password</label>
              <input type="password" id="confirm-password" minlength="6" required>
            </div>
            <button type="submit" class="gov-btn" style="width: 100%; margin-top:0.4rem;">Update password</button>
          </form>
        </div>
      </div>

      <!-- Change Login ID -->
      <div class="gov-panel">
        <div class="gov-panel-head"><h3>Change login ID</h3></div>
        <div class="gov-panel-body">
          <p style="font-size: 0.85rem; color: var(--muted); margin: 0 0 1rem;">
            You will have to sign in again after changing this.
          </p>
          <form id="change-id-form">
            <div class="gov-field">
              <label for="new-admin-id">New login ID</label>
              <input type="text" id="new-admin-id" required placeholder="e.g. ST-UP">
            </div>
            <div class="gov-field">
              <label for="id-password">Your password</label>
              <input type="password" id="id-password" required>
            </div>
            <button type="submit" class="gov-btn" style="width: 100%; margin-top:0.4rem;">Update login ID</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../common/common.js"></script>
  <script src="../common/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getAuthUser();
      if (!user || !['state', 'district', 'centre'].includes(user.role)) {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('acct-id').textContent = user.adminId || '—';
      document.getElementById('acct-role').textContent = user.role.toUpperCase();

      document.getElementById('change-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('current-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (newPassword !== confirm) {
          showToast('New passwords do not match', 'error');
          return;
        }
        try {
          await fetchAPI('/api/account/change-password', {
            method: 'POST',
            body: { currentPassword, newPassword }
          });
          showToast('Password changed successfully', 'success');
          e.target.reset();
        } catch (err) { /* handled in fetchAPI */ }
      });

      document.getElementById('change-id-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newAdminId = document.getElementById('new-admin-id').value.trim();
        const password = document.getElementById('id-password').value;
        try {
          const res = await fetchAPI('/api/account/change-id', {
            method: 'POST',
            body: { newAdminId, password }
          });
          showToast('Login ID updated. Please log in again.', 'success');
          setTimeout(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
          }, 1500);
        } catch (err) { /* handled in fetchAPI */ }
      });
    });
  </script>
</body>
</html>
