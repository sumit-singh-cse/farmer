<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Farmer Procurement Hub</title>
  <link rel="stylesheet" href="../common/style.css">
  <link rel="stylesheet" href="admin.css">
  <style>
    body.admin-console main { max-width: 460px; }
    .captcha-box { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.45rem; }
    .captcha-image-mock {
      background: #f4f5f6; color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.05rem; letter-spacing: 3px;
      padding: 0.35rem 0.8rem; border: 1px solid var(--line-dk); border-radius: 4px;
      user-select: none;
    }
    .captcha-refresh {
      background: none; border: none; color: var(--role);
      cursor: pointer; font-size: 0.85rem; text-decoration: underline; padding: 0;
    }
    .demo-note { border: 1px solid var(--line); border-radius: 4px; padding: 0.85rem 1rem; margin-top: 1.25rem; }
    .demo-note h4 { margin: 0 0 0.5rem; font-size: 0.88rem; }
    .demo-note div { font-size: 0.82rem; color: var(--muted); line-height: 1.7; }
    .demo-note code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; }
  </style>
</head>
<body class="admin-console">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Content -->
  <main>
    <div class="gov-panel">
      <div class="gov-panel-head"><h3>Admin sign in</h3></div>
      <div class="gov-panel-body">
        <p style="font-size:0.85rem; color:var(--muted); margin:0 0 1.1rem;">
          For state, district and centre accounts.
        </p>

        <form id="admin-login-form">
          <div class="gov-field">
            <label for="admin-role">Role</label>
            <select id="admin-role" required>
              <option value="">Select role</option>
              <option value="state">State</option>
              <option value="district">District</option>
              <option value="centre">Centre operator</option>
            </select>
          </div>

          <div class="gov-field">
            <label for="admin-id">Login ID</label>
            <input type="text" id="admin-id" placeholder="e.g. ST-UP" required>
          </div>

          <div class="gov-field">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" required>
          </div>

          <div class="gov-field">
            <label for="admin-otp">OTP</label>
            <input type="text" id="admin-otp" inputmode="numeric" required>
            <span style="font-size:0.78rem; color:var(--muted);">Demo OTP: 9999</span>
          </div>

          <div class="gov-field">
            <label for="captcha-input">Captcha</label>
            <input type="text" id="captcha-input" placeholder="Type the characters shown" required>
            <div class="captcha-box">
              <span class="captcha-image-mock" id="captcha-text">X7m9K</span>
              <button type="button" class="captcha-refresh" id="refresh-captcha-btn" title="Refresh captcha">Refresh</button>
            </div>
          </div>

          <button type="submit" class="gov-btn" style="width: 100%; margin-top: 0.6rem;">Sign in</button>
        </form>

        <!-- Demo Credentials Info -->
        <div class="demo-note">
          <h4>Demo accounts</h4>
          <div>
            <div>State — <code>ST-UP</code>, <code>ST-MP</code>, <code>ST-MH</code> (any state) · <code>state123</code></div>
            <div>District — <code>DT-IND-01</code> · <code>district123</code></div>
            <div>Centre — <code>OP-UJN-02</code> or your issued <code>CN-XX-…</code> code · <code>operator123</code> or issued temp password</div>
            <div style="margin-top:0.4rem;">OTP for all logins: <code>9999</code></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <script src="../common/common.js"></script>
  <script src="../common/navbar.js"></script>
  <script>
    // Demo flow
    const captchaText = document.getElementById('captcha-text');
    const refreshBtn = document.getElementById('refresh-captcha-btn');
    const form = document.getElementById('admin-login-form');

    const generateCaptcha = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      let result = '';
      for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      captchaText.textContent = result;
    };

    refreshBtn.addEventListener('click', generateCaptcha);
    
    // Initial run
    generateCaptcha();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredCaptcha = document.getElementById('captcha-input').value;
      if (enteredCaptcha !== captchaText.textContent) {
        showToast('Invalid Captcha! Please try again.', 'error');
        generateCaptcha();
        return;
      }
      
      const body = {
        role: document.getElementById('admin-role').value,
        adminId: document.getElementById('admin-id').value,
        password: document.getElementById('admin-password').value,
        otp: document.getElementById('admin-otp').value,
        captcha: enteredCaptcha
      };
      
      fetchAPI('/api/admin/login', {
        method: 'POST',
        body
      }).then(data => {
        showToast('Admin login successful! Redirecting...', 'success');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        setTimeout(() => {
          // First-login: force password change (temp password issued by district)
          if (data.user.mustChangePassword) {
            showToast('Please set a new password to continue.', 'success');
            window.location.href = 'account.html';
            return;
          }
          if (data.user.role === 'state') {
            window.location.href = 'state-dashboard.html';
          } else if (data.user.role === 'district') {
            window.location.href = 'district-dashboard.html';
          } else if (data.user.role === 'centre') {
            window.location.href = 'centre-dashboard.html';
          }
        }, 1200);
      }).catch(err => {
        // Handled in fetchAPI
      });
    });
  </script>
</body>
</html>
