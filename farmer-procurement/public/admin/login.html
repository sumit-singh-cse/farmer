<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Farmer Procurement Hub</title>
  <link rel="stylesheet" href="../common/style.css">
  <style>
    .admin-login-container {
      max-width: 480px;
      margin: 3rem auto;
    }
    .captcha-box {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 0.5rem;
    }
    .captcha-image-mock {
      background: linear-gradient(45deg, #e2e8f0, #cbd5e1);
      color: #334155;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 5px;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-style: italic;
      user-select: none;
      border: 1px dashed #94a3b8;
    }
    .captcha-refresh {
      background: none;
      border: none;
      color: var(--primary-color);
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Content -->
  <main>
    <div class="admin-login-container card">
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center; color: var(--primary-dark);">Admin Portal</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
        Sign in to state, district, or procurement centre administration panels.
      </p>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-role">Administrative Role</label>
          <select id="admin-role" class="form-control" required>
            <option value="">-- Select Role Level --</option>
            <option value="state">State Level Admin</option>
            <option value="district">District Level Admin</option>
            <option value="centre">Centre Operator</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-id">Admin ID / Code</label>
          <input type="text" id="admin-id" class="form-control" placeholder="Enter ID (e.g. ST-IND-01)" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Password</label>
          <input type="password" id="admin-password" class="form-control" placeholder="Enter security password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-otp">OTP (Security Key)</label>
          <input type="text" id="admin-otp" class="form-control" placeholder="Enter temporary dynamic OTP" required>
          <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 0.25rem;">Demo OTP: 9999</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="captcha-input">Captcha Verification</label>
          <input type="text" id="captcha-input" class="form-control" placeholder="Type the characters below" required>
          <div class="captcha-box">
            <span class="captcha-image-mock" id="captcha-text">X7m9K</span>
            <button type="button" class="captcha-refresh" id="refresh-captcha-btn" title="Refresh Captcha">🔄</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Admin Login</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <script src="../common/common.js"></script>
  <script src="../common/navbar.js"></script>
  <script>
    // Demo flow
    const captchaText = document.getElementById('captcha-text');
    const refreshBtn = document.getElementById('refresh-captcha-btn');
    const form = document.getElementById('admin-login-form');

    const generateCaptcha = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      let result = '';
      for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      captchaText.textContent = result;
    };

    refreshBtn.addEventListener('click', generateCaptcha);
    
    // Initial run
    generateCaptcha();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredCaptcha = document.getElementById('captcha-input').value;
      if (enteredCaptcha !== captchaText.textContent) {
        showToast('Invalid Captcha! Please try again.', 'error');
        generateCaptcha();
        return;
      }
      
      const body = {
        role: document.getElementById('admin-role').value,
        adminId: document.getElementById('admin-id').value,
        password: document.getElementById('admin-password').value,
        otp: document.getElementById('admin-otp').value,
        captcha: enteredCaptcha
      };
      
      fetchAPI('/api/admin/login', {
        method: 'POST',
        body
      }).then(data => {
        showToast('Admin login successful! Redirecting...', 'success');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        setTimeout(() => {
          if (data.user.role === 'state') {
            window.location.href = 'state-dashboard.html';
          } else if (data.user.role === 'district') {
            window.location.href = 'district-dashboard.html';
          } else if (data.user.role === 'centre') {
            window.location.href = 'centre-dashboard.html';
          }
        }, 1200);
      }).catch(err => {
        // Handled in fetchAPI
      });
    });
  </script>
</body>
</html>
