<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Registration - Farmer Procurement Hub</title>
  <link rel="stylesheet" href="../common/style.css">
  <style>
    .reg-container {
      max-width: 600px;
      margin: 2rem auto;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .form-row .form-group {
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Content -->
  <main>
    <div class="reg-container card">
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center; color: var(--primary-dark);">Farmer Registration</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
        Register your account to access digital Mandi slot booking.
      </p>

      <form id="farmer-register-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First Name</label>
            <input type="text" id="first-name" class="form-control" placeholder="Enter first name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last Name</label>
            <input type="text" id="last-name" class="form-control" placeholder="Enter last name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="mobile">Mobile Number</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="tel" id="mobile" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10}" required style="flex: 1;">
            <button type="button" id="reg-send-otp" class="btn btn-outline" style="padding: 0.8rem 1rem;">Send OTP</button>
          </div>
        </div>

        <div class="form-group" id="reg-otp-group" style="display: none;">
          <label class="form-label" for="otp">Enter Mobile OTP</label>
          <input type="text" id="otp" class="form-control" placeholder="6-digit verification code" pattern="[0-9]{6}">
        </div>

        <div class="form-group">
          <label class="form-label" for="aadhaar">Aadhaar / Reference Number</label>
          <input type="text" id="aadhaar" class="form-control" placeholder="12-digit Aadhaar number" pattern="[0-9]{12}" required>
          <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 0.25rem;">We store Aadhaar references securely and mask values.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="address">Full Address</label>
          <input type="text" id="address" class="form-control" placeholder="House/Village, Street, Post Office" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="state">State</label>
            <select id="state" class="form-control" required>
              <option value="">-- Select State --</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="district">District</label>
            <select id="district" class="form-control" required>
              <option value="">-- Select District --</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Create Password</label>
            <input type="password" id="password" class="form-control" placeholder="Choose a strong password" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Retype password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Register Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">Already registered?</span>
        <a href="login.html" style="font-weight: 600;">Login here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <script src="../common/common.js"></script>
  <script src="../common/navbar.js"></script>
  <script>
    const sendBtn = document.getElementById('reg-send-otp');
    const otpGroup = document.getElementById('reg-otp-group');
    const stateSel = document.getElementById('state');
    const distSel = document.getElementById('district');

    // Load states from API (database)
    async function loadStatesFromAPI() {
      try {
        console.log('Loading states from API...');
        const states = await fetchAPI('/api/states');
        console.log('States received:', states.length);

        stateSel.innerHTML = '<option value="">-- Select State --</option>';
        states.forEach(state => {
          const stateName = state.name || state;
          stateSel.innerHTML += `<option value="${stateName}">${stateName}</option>`;
        });
      } catch (err) {
        console.error('Failed to load states:', err);
        showToast('Failed to load states. Please refresh.', 'error');
      }
    }

    // Load districts for selected state
    async function loadDistrictsForState(stateName) {
      try {
        console.log('Loading districts for state:', stateName);
        distSel.innerHTML = '<option value="">-- Loading Districts --</option>';

        const districts = await fetchAPI(`/api/districts/${encodeURIComponent(stateName)}`);
        console.log('Districts received:', districts.length);

        distSel.innerHTML = '<option value="">-- Select District --</option>';
        districts.forEach(dist => {
          const distName = dist.name || dist;
          distSel.innerHTML += `<option value="${distName}">${distName}</option>`;
        });

        if (districts.length === 0) {
          distSel.innerHTML = '<option value="">No districts found</option>';
        }
      } catch (err) {
        console.error('Failed to load districts:', err);
        showToast('Failed to load districts', 'error');
      }
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Page loaded, loading states...');
      loadStatesFromAPI();
    });

    sendBtn.addEventListener('click', () => {
      const mob = document.getElementById('mobile').value;
      if (!/^\d{10}$/.test(mob)) {
        showToast('Please enter a valid 10-digit mobile number!', 'warning');
        return;
      }
      fetchAPI('/api/send-otp', {
        method: 'POST',
        body: { mobile: mob }
      }).then(data => {
        showToast(data.message, 'success');
        otpGroup.style.display = 'block';
        document.getElementById('otp').setAttribute('required', 'required');
        if (data.code) {
          console.log('📱 Demo OTP:', data.code);
          alert(`📱 Demo OTP: ${data.code}`);
        }
      }).catch(err => {
        console.error('OTP Error:', err);
      });
    });

    stateSel.addEventListener('change', () => {
      if (!stateSel.value) {
        distSel.innerHTML = '<option value="">-- Select District --</option>';
        return;
      }
      loadDistrictsForState(stateSel.value);
    });

    document.getElementById('farmer-register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirm-password').value;

      if (pw !== cpw) {
        showToast('Passwords do not match!', 'error');
        return;
      }

      const body = {
        firstName: document.getElementById('first-name').value,
        lastName: document.getElementById('last-name').value,
        mobile: document.getElementById('mobile').value,
        otp: document.getElementById('otp').value,
        aadhaar: document.getElementById('aadhaar').value,
        address: document.getElementById('address').value,
        state: stateSel.value,
        district: distSel.value,
        password: pw
      };

      fetchAPI('/api/register', {
        method: 'POST',
        body
      }).then(data => {
        showToast('Registration successful! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      }).catch(err => {
        console.error('Registration Error:', err);
      });
    });
  </script>
</body>
</html>
